<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muhib's Gym">
<title>Muhib's GymLog</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --sunk:#F3F5F7; --ink:#18222E; --muted:#5D6875; --line:#CDD3D9;
  --accent:#2F5DA8; --accent-ink:#FFFFFF; --danger:#B3362A; --tip:#2F8A55;
  --blue:#2F5DA8; --green:#2F8A55; --red:#C2402F; --yellow:#D9A21B; --grey:#6B7785; --violet:#7E62B0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141A21; --surface:#1D252F; --sunk:#18202A; --ink:#E8EDF2; --muted:#9AA6B2; --line:#2E3946;
    --accent:#6A95DC; --accent-ink:#0E1620; --danger:#E0675B; --tip:#5FBF86;
    --blue:#5B8BD9; --green:#4FAE76; --red:#DD6252; --yellow:#E6B83E; --grey:#8C98A6; --violet:#9F86CF;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header.top{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 6px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none}
#hdrWeek{color:var(--muted);font-size:14px}
main{max-width:560px;margin:0 auto;padding:8px 16px calc(100px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 8px;letter-spacing:.01em}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
p{margin:0 0 8px}
.meta{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
label > input,label > select,label > textarea{margin-top:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical}
label.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:16px;margin:4px 0 0}
label.check input{width:20px;height:20px;margin:0}
.btn{font:600 16px/1.2 var(--body);padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:7px 11px;font-size:14px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.wide{display:block;width:100%;margin-top:8px}
.icon{background:transparent;border:0;color:var(--muted);font-size:22px;line-height:1;padding:4px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plate{--c:var(--grey);display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 2px,var(--c) 2.6px);flex:none}
.plate.partial{background:radial-gradient(circle,transparent 0 4.4px,var(--c) 5px)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:600}
/* hero */
.hero{padding:10px 2px 18px}
.since{font-family:var(--display);font-weight:700;font-size:84px;line-height:.85}
.since-label{font-size:18px;margin-top:4px}
.hero .meta{margin-top:6px;font-size:15px}
.nudge{display:block;margin-top:10px;color:var(--accent);font-weight:600;background:none;border:0;padding:0;font-size:15px;cursor:pointer;text-align:left}
ol.tpl{margin:4px 0 6px;padding-left:22px}
ol.tpl li{padding:2px 0}
details.other{margin-top:12px}
details.other summary{cursor:pointer;color:var(--muted);font-size:15px;padding:6px 0}
.list{list-style:none;margin:0;padding:0}
.list li + li{border-top:1px solid var(--line)}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:10px 2px;cursor:pointer}
.rowbtn .grow{flex:1}
/* draft */
.exhead{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.hint{font-size:14px;color:var(--muted);margin:4px 0 2px}
.tip{font-size:14px;color:var(--tip);font-weight:600;margin:0 0 6px}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 96px 30px;gap:6px;align-items:center;margin:6px 0}
.setrow input,.setrow select{padding:8px 7px}
.setn{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;margin-top:4px}
.seg-b{flex:1;font:600 17px var(--display);padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.seg-b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:10px;margin:4px 0 12px}
.actions .primary{flex:1}
/* calendar */
.calnav h2{margin:0}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{margin:10px 0 4px;text-align:center;color:var(--muted);font-size:13px}
.day{aspect-ratio:1;border-radius:10px;background:var(--sunk);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 14px var(--body);color:var(--ink);padding:0;cursor:pointer}
.day.blank{visibility:hidden}
.day.today{border:2px solid var(--ink)}
.day .plate{width:18px;height:18px}
.day .plate.partial{background:radial-gradient(circle,transparent 0 5.6px,var(--c) 6.4px)}
.restmark{width:14px;height:3px;border-radius:2px;background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* progress + weight */
.big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:6px 0}
.chart{width:100%;height:auto;display:block;margin:8px 0}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.hist{font-size:15px}
.hist li{padding:9px 0}
.hist .d{font-weight:600}
/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sx{padding:8px 0;border-top:1px solid var(--line)}
.sx p{margin:2px 0 0;font-size:15px}
.skipped{color:var(--danger);font-size:14px;margin-top:8px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px);z-index:40}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 14px var(--body);padding:14px 2px 12px;cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:60;max-width:90vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
.warn{background:var(--danger);color:#fff;padding:10px 14px;border-radius:10px;margin:0 0 12px;font-size:15px}
.filebtn{color:var(--ink);font-size:16px}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#2F5DA8"/><circle cx="20" cy="20" r="16" fill="none" stroke="#4F7BC4" stroke-width="1"/><text x="20" y="27" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="21" fill="#fff">M</text></svg>Muhib's GymLog</h1>
  <span id="hdrWeek"></span>
</header>
<main id="main"></main>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-act="tab" data-view="log">Log</button>
  <button data-act="tab" data-view="calendar">Calendar</button>
  <button data-act="tab" data-view="progress">Progress</button>
  <button data-act="tab" data-view="weight">Weight</button>
  <button data-act="tab" data-view="backup">Backup</button>
</div></nav>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const KEY = 'gymlog.v1';
const ROT = ['Upper A','Lower A','Upper B','Lower B'];
const TYPES = [...ROT,'Chest/Triceps','Back/Biceps','Shoulders/Legs','Other'];
const TYPE_COLOR = {
  'Upper A':'var(--blue)','Upper B':'var(--blue)','Lower A':'var(--green)','Lower B':'var(--green)',
  'Chest/Triceps':'var(--red)','Back/Biceps':'var(--yellow)','Shoulders/Legs':'var(--grey)','Other':'var(--violet)'
};
const GROUPS = ['Chest','Back','Shoulders','Traps','Biceps','Triceps','Legs','Core','Other'];
const TAGS = {'':'Normal','W':'Warm-up','F':'Failed','G':'Grip gave out','X':'Form broke'};
const TAG_SHORT = {'W':'warm-up','F':'failed','G':'grip','X':'form'};

// name: [group, low reps, high reps, weight step (0 = next plate), unit]
const LIB_SEED = {
  'Incline DB Press':['Chest',8,12,2.5,'per hand'],
  'Flat DB Press':['Chest',8,12,2.5,'per hand'],
  'Pec Deck':['Chest',12,15,0,'stack'],
  'DB Chest Fly':['Chest',12,15,2.5,'per hand'],
  'Cable Chest Fly':['Chest',12,15,0,'stack'],
  'Dips':['Chest',6,12,0,'bodyweight'],
  'Seated Cable Row':['Back',10,12,0,'stack'],
  'Lat Pulldown':['Back',10,12,0,'stack'],
  'Straight-Arm Pulldown':['Back',12,15,0,'stack'],
  'Chest-Supported Row':['Back',10,12,2.5,'per hand'],
  'One-Arm DB Row':['Back',10,12,2.5,'per hand'],
  'Assisted Pull-up':['Back',8,12,0,'assist'],
  'Face Pull':['Shoulders',12,15,0,'stack'],
  'DB Shoulder Press':['Shoulders',8,12,2.5,'per hand'],
  'Cable Lateral Raise':['Shoulders',12,15,0,'stack'],
  'DB Lateral Raise':['Shoulders',12,15,2.5,'per hand'],
  'Cable Rear Delt Pull':['Shoulders',12,15,0,'stack'],
  'Shrugs':['Traps',12,15,5,'per side'],
  'Cable Biceps Curl':['Biceps',12,15,0,'stack'],
  'Cable Rope Hammer Curl':['Biceps',12,15,0,'stack'],
  'Machine Biceps Curl':['Biceps',12,15,0,'stack'],
  'EZ-Bar Cable Curl':['Biceps',12,15,0,'stack'],
  'Incline DB Curl':['Biceps',10,12,2.5,'per hand'],
  'Triceps Pushdown':['Triceps',12,15,0,'stack'],
  'Triceps Rope Pushdown':['Triceps',12,15,0,'stack'],
  'Overhead Cable Triceps Extension':['Triceps',12,15,0,'stack'],
  'DB Overhead Triceps Extension':['Triceps',10,12,2.5,'per hand'],
  'Cable Triceps Kickback':['Triceps',12,15,0,'stack'],
  'Goblet Squat':['Legs',8,12,2.5,'one dumbbell'],
  'Hack Squat':['Legs',8,12,5,'per side'],
  'Leg Press':['Legs',10,12,10,'total'],
  'Trap Bar Deadlift':['Legs',8,10,5,'total'],
  'DB Romanian Deadlift':['Legs',8,12,2.5,'per hand'],
  'Leg Extension':['Legs',12,15,0,'stack'],
  'Leg Curl':['Legs',10,15,0,'stack'],
  'Step-ups':['Legs',10,12,2.5,'per hand'],
  'Walking Lunges':['Legs',10,12,2.5,'per hand'],
  'Bulgarian Split Squat':['Legs',8,10,2.5,'per hand'],
  'Hip Thrust':['Legs',10,12,5,'total'],
  'Glute Bridge':['Legs',12,15,5,'total'],
  'Standing Calf Raise':['Legs',12,15,5,'per side'],
  'Farmer Carry':['Core',30,40,2.5,'meters'],
  'Pallof Press':['Core',10,12,0,'stack'],
  'Dead Bug':['Core',10,12,0,'bodyweight'],
  'Plank':['Core',30,45,0,'seconds']
};

const TEMPLATES = {
  'Upper A':['Incline DB Press','Seated Cable Row','DB Shoulder Press','Lat Pulldown','Cable Lateral Raise','Triceps Pushdown','Cable Biceps Curl'],
  'Lower A':['Goblet Squat','DB Romanian Deadlift','Leg Curl','Step-ups','Standing Calf Raise','Dead Bug','Plank'],
  'Upper B':['Flat DB Press','Chest-Supported Row','Assisted Pull-up','Pec Deck','Face Pull','Shrugs','Overhead Cable Triceps Extension','Cable Rope Hammer Curl'],
  'Lower B':['Trap Bar Deadlift','Bulgarian Split Squat','Leg Extension','Hip Thrust','Farmer Carry','Pallof Press']
};

// Your workouts live only on your phone. Restore old logs from a backup file in the Backup tab.
const SEED = [];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad2 = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const todayStr = () => dstr(new Date());
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysBetween = (a,b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const fmtDate = (s, yr) => toDate(s).toLocaleDateString('en-GB', yr ? {day:'numeric',month:'short',year:'numeric'} : {day:'numeric',month:'short'});
const fmtW = w => (w == null || isNaN(w)) ? '—' : String(Math.round(w*100)/100);
const clone = o => JSON.parse(JSON.stringify(o));
const repLabel = u => u === 'seconds' ? 'sec' : u === 'meters' ? 'm' : 'reps';

function parseSets(str){
  return str.split(',').flatMap(tok => {
    const m = tok.trim().match(/^([\d.]+)x(\d+|\?)([WFGX]?)(?:\*(\d+))?$/);
    if (!m) return [];
    const set = {w:+m[1], r: m[2] === '?' ? null : +m[2], t: m[3] || ''};
    const n = m[4] ? +m[4] : 1;
    return Array.from({length:n}, () => ({...set}));
  });
}

function seedLib(){
  const lib = {};
  for (const [k,v] of Object.entries(LIB_SEED)) lib[k] = {g:v[0], lo:v[1], hi:v[2], step:v[3], unit:v[4]};
  return lib;
}

function seedState(){
  return {
    v:1,
    lib: seedLib(),
    sessions: SEED.map(([date,type,partial,notes,exs], i) => ({
      id: 'seed' + i, date, type, partial: !!partial, energy: null, notes: notes || '', skipped: [],
      exercises: exs.map(([n,s]) => ({name:n, sets:parseSets(s)}))
    })),
    weights: [],
    rest: [], draft: null, lastBackup: null
  };
}

function migrate(o){
  const s = Object.assign({v:1, lib:{}, sessions:[], weights:[], rest:[], draft:null, lastBackup:null}, o);
  const base = seedLib();
  for (const k in base) if (!s.lib[k]) s.lib[k] = base[k];
  for (const ses of s.sessions) for (const ex of ses.exercises) {
    if (!s.lib[ex.name]) s.lib[ex.name] = {g:'Other', lo:8, hi:12, step:0, unit:''};
  }
  return s;
}

let storageOK = true;
try { localStorage.setItem('gymlog.test','1'); localStorage.removeItem('gymlog.test'); } catch(e){ storageOK = false; }

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch(e){}
  return seedState();
}
let S = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOK = false; }
}
let saveTimer = null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
save();

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- data queries ---------- */
const sortedSessions = () => [...S.sessions].sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
const libOf = name => S.lib[name] || {g:'Other', lo:8, hi:12, step:0, unit:''};
const working = sets => sets.filter(s => s.t !== 'W' && s.w != null && !isNaN(s.w));

function topSet(sets, unit){
  const ws = working(sets);
  if (!ws.length) return null;
  return ws.reduce((best, s) => {
    if (!best) return s;
    const better = unit === 'assist' ? s.w < best.w : s.w > best.w;
    if (better) return s;
    if (s.w === best.w && (s.r || 0) > (best.r || 0)) return s;
    return best;
  }, null);
}

function lastWith(name, onOrBefore, excludeId){
  for (const s of sortedSessions()) {
    if (s.id === excludeId) continue;
    if (onOrBefore && s.date > onOrBefore) continue;
    const ex = s.exercises.find(e => e.name === name && e.sets.length);
    if (ex) return {date:s.date, ex};
  }
  return null;
}

function suggestion(name, sets){
  const L = libOf(name);
  const ws = working(sets);
  if (!ws.length) return '';
  const top = topSet(sets, L.unit);
  if (ws.some(s => s.t === 'F' || s.t === 'X')) return `Stay at ${fmtW(top.w)} kg and make every rep clean.`;
  const allTop = ws.every(s => s.r != null && s.r >= L.hi);
  if (!allTop) return `Stay at ${fmtW(top.w)} kg and add reps.`;
  if (L.unit === 'assist') return 'Use one step less assistance.';
  if (L.unit === 'bodyweight') return 'Add reps or try a harder version.';
  if (L.unit === 'seconds') return `Hold ${L.hi + 10} sec next time.`;
  if (L.step > 0) return `Go up to ${fmtW(top.w + L.step)} kg.`;
  return 'Go up one plate.';
}

function setsSummary(sets){
  return sets.map(s => `${fmtW(s.w)}×${s.r == null ? '?' : s.r}${s.t ? ' (' + TAG_SHORT[s.t] + ')' : ''}`).join(', ');
}

function nextType(){
  const r = sortedSessions().find(s => ROT.includes(s.type));
  return r ? ROT[(ROT.indexOf(r.type) + 1) % ROT.length] : 'Upper A';
}

function weekCount(){
  const t = toDate(todayStr());
  const start = new Date(t); start.setDate(t.getDate() - t.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const a = dstr(start), b = dstr(end);
  return new Set(S.sessions.filter(s => s.date >= a && s.date <= b).map(s => s.date)).size;
}

function matchName(v){
  const t = v.trim();
  if (!t) return '';
  const k = Object.keys(S.lib).find(n => n.toLowerCase() === t.toLowerCase());
  return k || t;
}

/* ---------- chart ---------- */
function chart(pts, unitLabel){
  if (pts.length < 2) return pts.length ? '<p class="meta">Log this once more to see a chart.</p>' : '';
  const W = 340, H = 180, pl = 38, pr = 14, pt = 14, pb = 28;
  const xs = pts.map(p => toDate(p.d).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + 1;
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const padY = (y1 - y0) * 0.18 || 1; y0 -= padY; y1 += padY;
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  let g = '';
  for (let k = 0; k <= 2; k++) {
    const v = y0 + (y1 - y0) * k / 2, y = Y(v).toFixed(1);
    g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${fmtW(Math.round(v * 2) / 2)}</text>`;
  }
  const line = pts.map((p,i) => `${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const dots = pts.map((p,i) => `<circle class="pt" r="3.6" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}"><title>${fmtDate(p.d)}: ${fmtW(p.y)} ${unitLabel}</title></circle>`).join('');
  const lab = `<text x="${pl}" y="${H - 8}">${fmtDate(pts[0].d)}</text><text x="${W - pr}" y="${H - 8}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart from ${fmtDate(pts[0].d)} to ${fmtDate(pts[pts.length-1].d)}">${g}<polyline class="ln" points="${line}"/>${dots}${lab}</svg>`;
}

/* ---------- views ---------- */
let view = 'log';
let calMonth = null;
let progGroup = '';
let progEx = '';

function plate(type, partial){
  return `<i class="plate${partial ? ' partial' : ''}" style="--c:${TYPE_COLOR[type] || 'var(--grey)'}"></i>`;
}

function viewLog(){
  if (S.draft) return viewDraft();
  const ss = sortedSessions();
  const t = todayStr();
  const last = ss[0];
  const since = last ? daysBetween(last.date, t) : null;
  const next = nextType();
  const wk = weekCount();
  const backupAge = S.lastBackup ? daysBetween(S.lastBackup, t) : null;
  const nudge = (backupAge === null || backupAge > 7)
    ? `<button class="nudge" data-act="tab" data-view="backup">${backupAge === null ? 'You haven\'t backed up yet. Back up now' : `Last backup ${backupAge} days ago. Back up now`}</button>` : '';
  const label = since === null ? 'No workouts yet' : since === 0 ? 'days since your last workout. You trained today.' : since === 1 ? 'day since your last workout' : 'days since your last workout';
  return `
  ${storageOK ? '' : '<p class="warn">This browser isn\'t saving your data. Open the app from its GitHub Pages link instead.</p>'}
  <section class="hero">
    <div class="since">${since === null ? '0' : since}</div>
    <div class="since-label">${label}</div>
    <p class="meta">${wk} of 4 sessions this week</p>
    ${nudge}
  </section>
  <section class="panel">
    <div class="row between"><h2>Next up</h2><span class="badge">${plate(next)}${next}</span></div>
    <ol class="tpl">${TEMPLATES[next].map(n => `<li>${esc(n)}</li>`).join('')}</ol>
    <button class="btn primary wide" data-act="start" data-type="${next}">Start ${next}</button>
    <details class="other"><summary>Log a different workout or date</summary>
      <div class="grid2" style="margin-top:8px">
        <label>Workout<select id="otherType">${TYPES.map(o => `<option${o === next ? ' selected' : ''}>${o}</option>`).join('')}</select></label>
        <label>Date<input type="date" id="otherDate" value="${t}"></label>
      </div>
      <button class="btn wide" data-act="startOther">Start workout</button>
    </details>
  </section>
  <section class="panel">
    <h2>Recent workouts</h2>
    ${ss.length ? `<ul class="list">${ss.slice(0,6).map(s => `<li><button class="rowbtn" data-act="open" data-id="${s.id}">${plate(s.type, s.partial)}<span class="grow">${esc(s.type)}</span><span class="meta">${fmtDate(s.date)}</span></button></li>`).join('')}</ul>` : '<p class="meta">Your saved workouts will show here.</p>'}
  </section>`;
}

function exCard(ex, i){
  const L = libOf(ex.name);
  const prev = lastWith(ex.name, S.draft.date, S.draft.id);
  let tipText = prev ? suggestion(ex.name, prev.ex.sets) : '';
  if (prev) {
    const gap = daysBetween(prev.date, S.draft.date);
    const top = topSet(prev.ex.sets, L.unit);
    if (gap > 14 && top && top.w > 0 && L.unit !== 'assist' && L.unit !== 'bodyweight') {
      const unitStep = L.step > 0 ? L.step : 1;
      const start = Math.max(unitStep, Math.round(top.w * 0.75 / unitStep) * unitStep);
      tipText = `It's been ${Math.round(gap / 7)} weeks. Start around ${fmtW(start)} kg and build back up.`;
    }
  }
  const hint = prev
    ? `<p class="hint">Last time, ${fmtDate(prev.date)}: ${esc(setsSummary(prev.ex.sets))}</p><p class="tip">${esc(tipText)}</p>`
    : '<p class="hint">First time logging this one.</p>';
  const rl = repLabel(L.unit);
  const rows = ex.sets.map((s,j) => `
    <div class="setrow">
      <span class="setn">Set ${j+1}</span>
      <input inputmode="decimal" placeholder="kg" aria-label="Set ${j+1} weight in kg" data-i="${i}" data-j="${j}" data-k="w" value="${s.w == null ? '' : s.w}">
      <input inputmode="numeric" placeholder="${rl}" aria-label="Set ${j+1} ${rl}" data-i="${i}" data-j="${j}" data-k="r" value="${s.r == null ? '' : s.r}">
      <select aria-label="Set ${j+1} note" data-i="${i}" data-j="${j}" data-k="t">${Object.entries(TAGS).map(([k,v]) => `<option value="${k}"${s.t === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
      <button class="icon" data-act="delSet" data-i="${i}" data-j="${j}" aria-label="Remove set ${j+1}">×</button>
    </div>`).join('');
  return `
  <section class="panel">
    <div class="exhead"><h3>${esc(ex.name)}</h3><span class="meta">${esc(L.g)}${L.unit ? ', ' + esc(L.unit) : ''}, ${L.lo}–${L.hi} ${rl}</span></div>
    ${hint}
    ${rows}
    <div class="row" style="margin-top:6px">
      <button class="btn small" data-act="addSet" data-i="${i}">Add set</button>
      <span class="spacer"></span>
      ${i > 0 ? `<button class="btn small ghost" data-act="moveUp" data-i="${i}">Move up</button>` : ''}
      <button class="btn small ghost danger" data-act="delEx" data-i="${i}">Remove</button>
    </div>
  </section>`;
}

function viewDraft(){
  const d = S.draft;
  return `
  <section class="panel">
    <div class="grid2">
      <label>Workout<select data-f="type">${TYPES.map(o => `<option${o === d.type ? ' selected' : ''}>${o}</option>`).join('')}</select></label>
      <label>Date<input type="date" data-f="date" value="${d.date}"></label>
    </div>
    <span class="meta">Energy today, 1 is low and 5 is high</span>
    <div class="seg">${[1,2,3,4,5].map(n => `<button class="seg-b${d.energy === n ? ' on' : ''}" data-act="energy" data-n="${n}" aria-pressed="${d.energy === n}">${n}</button>`).join('')}</div>
  </section>
  ${d.exercises.map(exCard).join('')}
  <section class="panel">
    <label>Add exercise<input id="addName" list="exlist" placeholder="Start typing, e.g. lat" autocomplete="off"></label>
    <div id="newGroup" hidden><label>This is a new exercise. Which muscle group?<select id="addGroup">${GROUPS.map(g => `<option>${g}</option>`).join('')}</select></label></div>
    <datalist id="exlist">${Object.keys(S.lib).sort().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <button class="btn wide" data-act="addEx">Add exercise</button>
  </section>
  <section class="panel">
    <label>Notes<textarea data-f="notes" rows="3" placeholder="How did it feel?">${esc(d.notes)}</textarea></label>
    <label class="check"><input type="checkbox" data-f="partial"${d.partial ? ' checked' : ''}> I cut this workout short</label>
  </section>
  <div class="actions">
    <button class="btn primary" data-act="saveDraft">Save workout</button>
    <button class="btn ghost danger" data-act="discard">Discard</button>
  </div>
  <p class="meta">Exercises with no sets are saved as skipped.</p>`;
}

function viewCalendar(){
  if (!calMonth) calMonth = todayStr().slice(0,7);
  const [y,m] = calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const days = new Date(y, m, 0).getDate();
  const t = todayStr();
  const byDate = {};
  for (const s of S.sessions) (byDate[s.date] = byDate[s.date] || []).push(s);
  let cells = '';
  for (let k = 0; k < first.getDay(); k++) cells += '<span class="day blank" aria-hidden="true"></span>';
  let monthCount = 0;
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad2(m)}-${pad2(d)}`;
    const ss = byDate[ds];
    const rest = S.rest.includes(ds);
    if (ss) monthCount++;
    const mark = ss ? plate(ss[0].type, ss[0].partial) : rest ? '<i class="restmark"></i>' : '';
    const al = fmtDate(ds) + (ss ? ', ' + ss[0].type + (ss[0].partial ? ', cut short' : '') : rest ? ', rest day' : '');
    cells += `<button class="day${ds === t ? ' today' : ''}" data-act="day" data-d="${ds}" aria-label="${esc(al)}"><span>${d}</span>${mark}</button>`;
  }
  const title = first.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  const legend = [['Upper','Upper A'],['Lower','Lower A'],['Chest/Triceps','Chest/Triceps'],['Back/Biceps','Back/Biceps'],['Shoulders/Legs','Shoulders/Legs']]
    .map(([l,ty]) => `<span>${plate(ty)}${l}</span>`).join('') +
    `<span>${plate('Upper A', true)}Cut short</span><span><i class="restmark"></i>Rest day</span>`;
  return `
  <section class="panel">
    <div class="row between calnav">
      <button class="btn small" data-act="calMove" data-n="-1" aria-label="Previous month">‹</button>
      <h2>${title}</h2>
      <button class="btn small" data-act="calMove" data-n="1" aria-label="Next month">›</button>
    </div>
    <div class="dow" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal">${cells}</div>
    <p class="meta" style="margin-top:12px">${monthCount} workout${monthCount === 1 ? '' : 's'} this month. ${weekCount()} of 4 this week.</p>
    <div class="legend">${legend}</div>
  </section>
  <p class="meta">Tap a day to see the workout, log one, or mark a rest day.</p>`;
}

function historyOf(name){
  const L = libOf(name);
  return [...S.sessions].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0)
    .map(s => { const ex = s.exercises.find(e => e.name === name); if (!ex || !ex.sets.length) return null; return {d:s.date, sets:ex.sets, top:topSet(ex.sets, L.unit)}; })
    .filter(Boolean);
}

function viewProgress(){
  const names = [...new Set(S.sessions.flatMap(s => s.exercises.map(e => e.name)))].sort();
  if (!names.length) return '<section class="panel"><h2>Progress</h2><p>Log a workout to start tracking progress.</p></section>';
  const groups = GROUPS.filter(g => names.some(n => libOf(n).g === g));
  if (progGroup && !groups.includes(progGroup)) progGroup = '';
  const shown = names.filter(n => !progGroup || libOf(n).g === progGroup);
  if (!shown.includes(progEx)) progEx = shown.includes('Incline DB Press') ? 'Incline DB Press' : shown[0];
  const L = libOf(progEx);
  const h = historyOf(progEx);
  const pts = h.filter(x => x.top).map(x => ({d:x.d, y:x.top.w}));
  let summary = '';
  if (pts.length) {
    const firstP = pts[0], lastP = pts[pts.length-1];
    const best = h.filter(x => x.top).reduce((b,x) => !b ? x : (L.unit === 'assist' ? x.top.w < b.top.w : x.top.w > b.top.w) ? x : b, null);
    summary = `
      <p class="big">${fmtW(firstP.y)} → ${fmtW(lastP.y)} kg</p>
      <p class="meta">Heaviest working set, first session to latest${L.unit ? ' (' + esc(L.unit) + ')' : ''}. ${L.unit === 'assist' ? 'Less assistance means stronger. ' : ''}Best: ${fmtW(best.top.w)} kg × ${best.top.r == null ? '?' : best.top.r} on ${fmtDate(best.d, true)}. ${h.length} session${h.length === 1 ? '' : 's'} logged.</p>`;
  }
  return `
  <section class="panel">
    <div class="grid2">
      <label>Muscle group<select id="progGroup"><option value="">All</option>${groups.map(g => `<option${g === progGroup ? ' selected' : ''}>${g}</option>`).join('')}</select></label>
      <label>Exercise<select id="progEx">${shown.map(n => `<option${n === progEx ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
    </div>
    <h2>${esc(progEx)}</h2>
    ${summary}
    ${chart(pts, 'kg')}
  </section>
  <section class="panel">
    <h2>Every session</h2>
    <ul class="list hist">${[...h].reverse().map(x => `<li><span class="d">${fmtDate(x.d, true)}</span><br>${esc(setsSummary(x.sets))}</li>`).join('')}</ul>
  </section>`;
}

function viewWeight(){
  const ws = [...S.weights].sort((a,b) => a.date < b.date ? -1 : 1);
  const t = todayStr();
  let stats = '';
  if (ws.length) {
    const first = ws[0], last = ws[ws.length-1];
    const diff = Math.round((last.kg - first.kg) * 10) / 10;
    const recent = ws.filter(w => daysBetween(w.date, t) <= 6 && daysBetween(w.date, t) >= 0);
    const avg = recent.length ? Math.round(recent.reduce((a,w) => a + w.kg, 0) / recent.length * 10) / 10 : null;
    stats = `<p class="big">${fmtW(last.kg)} kg</p>
      <p class="meta">${diff === 0 ? 'No change' : (diff > 0 ? '+' : '') + diff + ' kg'} since ${fmtDate(first.date, true)}.${avg != null ? ` Average of the last 7 days: ${avg} kg.` : ''}</p>`;
  }
  return `
  <section class="panel">
    <h2>Log your weight</h2>
    <div class="grid2">
      <label>Date<input type="date" id="wDate" value="${t}"></label>
      <label>Weight in kg<input id="wKg" inputmode="decimal" placeholder="e.g. 102.4"></label>
    </div>
    <button class="btn primary wide" data-act="saveWeight">Save weight</button>
    <p class="meta" style="margin-top:10px">Weigh in the morning after the toilet, 2 or 3 times a week. Judge by the weekly average, not single days.</p>
  </section>
  <section class="panel">
    ${stats || '<p class="meta">Your weigh-ins will show here.</p>'}
    ${chart(ws.map(w => ({d:w.date, y:w.kg})), 'kg')}
    <ul class="list">${[...ws].reverse().map(w => `<li class="row between" style="padding:6px 0"><span>${fmtDate(w.date, true)}</span><span class="row"><strong>${fmtW(w.kg)} kg</strong><button class="icon" data-act="delWeight" data-d="${w.date}" aria-label="Delete weigh-in on ${fmtDate(w.date, true)}">×</button></span></li>`).join('')}</ul>
  </section>`;
}

function viewBackup(){
  return `
  <section class="panel">
    <h2>Back up your data</h2>
    <p>Your workouts are saved in this browser on this phone. If the browser's data is cleared, they're gone. Save a backup once a week.</p>
    <p>To keep it in Gmail: tap Save or share, choose Gmail, and send it to yourself.</p>
    <p class="meta">Last backup: ${S.lastBackup ? fmtDate(S.lastBackup, true) : 'never'}</p>
    <button class="btn primary wide" data-act="export">Save or share backup file</button>
    <button class="btn wide" data-act="copy">Copy backup as text</button>
  </section>
  <section class="panel">
    <h2>Restore from a backup</h2>
    <p class="meta">This replaces everything in the app with the backup.</p>
    <label class="btn wide filebtn">Choose backup file<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden></label>
    <label style="margin-top:12px">Or paste backup text<textarea id="importText" rows="4"></textarea></label>
    <button class="btn wide" data-act="importText">Restore from pasted text</button>
  </section>
  <section class="panel">
    <h2>Your data</h2>
    <p class="meta">${S.sessions.length} workouts, ${S.weights.length} weigh-ins, ${Object.keys(S.lib).length} exercises in your list.</p>
  </section>`;

const VIEWS = {log:viewLog, calendar:viewCalendar, progress:viewProgress, weight:viewWeight, backup:viewBackup};

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => {
    if (b.dataset.view === view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  $('#main').innerHTML = VIEWS[view]();
  $('#hdrWeek').textContent = `${weekCount()} of 4 this week`;
}

/* ---------- sheet ---------- */
function openSheet(html){
  $('#sheet').innerHTML = `<div class="sheet-wrap" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $('#sheet button'); if (f) f.focus({preventScroll:true});
}
function closeSheet(){ $('#sheet').innerHTML = ''; }

function openSession(id){
  const s = S.sessions.find(x => x.id === id); if (!s) return;
  const meta = [fmtDate(s.date, true)];
  if (s.energy) meta.push(`energy ${s.energy} of 5`);
  if (s.partial) meta.push('cut short');
  openSheet(`
    <div class="row between"><h2 class="badge">${plate(s.type, s.partial)}${esc(s.type)}</h2><button class="icon" data-act="close" aria-label="Close">×</button></div>
    <p class="meta">${esc(meta.join(', '))}</p>
    ${s.exercises.map(e => `<div class="sx"><h3>${esc(e.name)}</h3><p>${esc(setsSummary(e.sets))}</p></div>`).join('')}
    ${s.skipped && s.skipped.length ? `<p class="skipped">Skipped: ${esc(s.skipped.join(', '))}</p>` : ''}
    ${s.notes ? `<div class="sx"><p>${esc(s.notes)}</p></div>` : ''}
    <div class="actions" style="margin-top:14px">
      <button class="btn primary" data-act="edit" data-id="${s.id}">Edit</button>
      <button class="btn ghost danger" data-act="delSession" data-id="${s.id}">Delete</button>
    </div>`);
}

/* ---------- actions ---------- */
function startDraft(type, date){
  if (S.draft) { toast('Finish or discard your current workout first'); view = 'log'; closeSheet(); render(); return; }
  S.draft = {id:null, date: date || todayStr(), type, energy:null, notes:'', partial:false,
    exercises: (TEMPLATES[type] || []).map(n => ({name:n, sets:[]}))};
  view = 'log'; closeSheet(); save(); render(); window.scrollTo(0,0);
}

function readExport(){ return JSON.stringify(S); }

async function doExport(){
  const data = readExport();
  const name = `muhibs-gymlog-backup-${todayStr()}.json`;
  let done = false;
  try {
    const file = new File([data], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:"Muhib's GymLog backup"});
      done = true;
    }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  if (!done) {
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }
  S.lastBackup = todayStr(); save(); toast('Backup saved'); render();
}

function restoreFrom(text){
  let o;
  try { o = JSON.parse(text); } catch(e) { toast('That text isn\'t a GymLog backup'); return; }
  if (!o || !Array.isArray(o.sessions)) { toast('That file isn\'t a GymLog backup'); return; }
  if (!confirm(`Replace everything in the app with this backup? It has ${o.sessions.length} workouts.`)) return;
  S = migrate(o); save(); toast('Backup restored'); view = 'log'; render();
}

const ACTIONS = {
  tab: b => { view = b.dataset.view; closeSheet(); render(); window.scrollTo(0,0); },
  start: b => startDraft(b.dataset.type, todayStr()),
  startOther: () => startDraft($('#otherType').value, $('#otherDate').value || todayStr()),
  energy: b => { const n = +b.dataset.n; S.draft.energy = S.draft.energy === n ? null : n; save(); render(); },
  addSet: b => {
    const ex = S.draft.exercises[+b.dataset.i];
    const lastSet = ex.sets[ex.sets.length - 1];
    if (lastSet) ex.sets.push({w:lastSet.w, r:lastSet.r, t:''});
    else {
      const prev = lastWith(ex.name, S.draft.date, S.draft.id);
      const ws = prev ? working(prev.ex.sets) : [];
      ex.sets.push({w: ws.length ? ws[0].w : null, r: null, t: ''});
    }
    save(); render();
  },
  delSet: b => { S.draft.exercises[+b.dataset.i].sets.splice(+b.dataset.j, 1); save(); render(); },
  delEx: b => {
    const ex = S.draft.exercises[+b.dataset.i];
    if (ex.sets.length && !confirm(`Remove ${ex.name} and its sets?`)) return;
    S.draft.exercises.splice(+b.dataset.i, 1); save(); render();
  },
  moveUp: b => { const i = +b.dataset.i, a = S.draft.exercises; [a[i-1], a[i]] = [a[i], a[i-1]]; save(); render(); },
  addEx: () => {
    const name = matchName($('#addName').value);
    if (!name) { toast('Type an exercise name first'); return; }
    if (!S.lib[name]) S.lib[name] = {g: $('#addGroup').value, lo:8, hi:12, step:0, unit:''};
    S.draft.exercises.push({name, sets:[]}); save(); render();
  },
  saveDraft: () => {
    const d = S.draft, exs = [], skipped = [];
    for (const ex of d.exercises) {
      const sets = ex.sets.filter(s => (s.w != null && !isNaN(s.w)) || (s.r != null && !isNaN(s.r)));
      if (sets.length) exs.push({name:ex.name, sets}); else skipped.push(ex.name);
    }
    if (!exs.length) { toast('Add at least one set before saving'); return; }
    const sess = {id: d.id || uid(), date: d.date || todayStr(), type: d.type, energy: d.energy,
      notes: (d.notes || '').trim(), partial: !!d.partial, skipped, exercises: exs};
    const idx = S.sessions.findIndex(s => s.id === sess.id);
    if (idx >= 0) S.sessions[idx] = sess; else S.sessions.push(sess);
    S.rest = S.rest.filter(x => x !== sess.date);
    S.draft = null; save(); toast('Workout saved'); render(); window.scrollTo(0,0);
  },
  discard: () => { if (!confirm('Discard this workout?')) return; S.draft = null; save(); render(); },
  open: b => openSession(b.dataset.id),
  close: () => closeSheet(),
  backdrop: (b, e) => { if (e.target === b) closeSheet(); },
  edit: b => {
    if (S.draft) { toast('Finish or discard your current workout first'); return; }
    const s = S.sessions.find(x => x.id === b.dataset.id);
    S.draft = clone(s);
    for (const n of (s.skipped || [])) S.draft.exercises.push({name:n, sets:[]});
    delete S.draft.skipped;
    view = 'log'; closeSheet(); save(); render(); window.scrollTo(0,0);
  },
  delSession: b => {
    if (!confirm('Delete this workout? This can\'t be undone.')) return;
    S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save(); closeSheet(); toast('Workout deleted'); render();
  },
  calMove: b => {
    const [y,m] = calMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + (+b.dataset.n), 1);
    calMonth = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; render();
  },
  day: b => {
    const ds = b.dataset.d;
    const ss = S.sessions.filter(s => s.date === ds);
    if (ss.length === 1) return openSession(ss[0].id);
    if (ss.length > 1) {
      openSheet(`<div class="row between"><h2>${fmtDate(ds, true)}</h2><button class="icon" data-act="close" aria-label="Close">×</button></div>
        <ul class="list">${ss.map(s => `<li><button class="rowbtn" data-act="open" data-id="${s.id}">${plate(s.type, s.partial)}<span class="grow">${esc(s.type)}</span></button></li>`).join('')}</ul>`);
      return;
    }
    const rest = S.rest.includes(ds);
    openSheet(`<div class="row between"><h2>${fmtDate(ds, true)}</h2><button class="icon" data-act="close" aria-label="Close">×</button></div>
      <p class="meta">${rest ? 'Marked as a rest day.' : 'No workout logged.'}</p>
      <button class="btn primary wide" data-act="logOn" data-d="${ds}">Log a workout on this day</button>
      <button class="btn wide" data-act="toggleRest" data-d="${ds}">${rest ? 'Remove rest day' : 'Mark as rest day'}</button>`);
  },
  logOn: b => startDraft(nextType(), b.dataset.d),
  toggleRest: b => {
    const ds = b.dataset.d;
    S.rest = S.rest.includes(ds) ? S.rest.filter(x => x !== ds) : [...S.rest, ds];
    save(); closeSheet(); render();
  },
  saveWeight: () => {
    const kg = Number(($('#wKg').value || '').trim().replace(',', '.'));
    const date = $('#wDate').value || todayStr();
    if (!kg || isNaN(kg) || kg < 30 || kg > 300) { toast('Enter your weight in kg'); return; }
    S.weights = S.weights.filter(w => w.date !== date);
    S.weights.push({date, kg}); save(); toast('Weight saved'); render();
  },
  delWeight: b => {
    if (!confirm('Delete this weigh-in?')) return;
    S.weights = S.weights.filter(w => w.date !== b.dataset.d); save(); render();
  },
  export: () => doExport(),
  copy: () => {
    if (!navigator.clipboard) { toast('Copy isn\'t available here. Use Save or share instead.'); return; }
    navigator.clipboard.writeText(readExport())
      .then(() => { S.lastBackup = todayStr(); save(); toast('Backup copied. Paste it into an email to yourself.'); render(); })
      .catch(() => toast('Copy failed. Use Save or share instead.'));
  },
  importText: () => { const t = $('#importText').value.trim(); if (!t) { toast('Paste your backup text first'); return; } restoreFrom(t); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b, e);
});

function onField(e){
  const el = e.target;
  if (el.id === 'progGroup') { progGroup = el.value; progEx = ''; render(); return; }
  if (el.id === 'progEx') { progEx = el.value; render(); return; }
  if (el.id === 'importFile' && e.type === 'change' && el.files && el.files[0]) {
    const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(el.files[0]); return;
  }
  if (el.id === 'addName') {
    const v = el.value.trim();
    $('#newGroup').hidden = !v || !!S.lib[matchName(v)];
    return;
  }
  if (!S.draft) return;
  if (el.dataset.k) {
    const s = S.draft.exercises[+el.dataset.i].sets[+el.dataset.j];
    if (!s) return;
    if (el.dataset.k === 't') s.t = el.value;
    else { const v = el.value.trim().replace(',', '.'); const n = Number(v); s[el.dataset.k] = (v === '' || isNaN(n)) ? null : n; }
    saveSoon();
  } else if (el.dataset.f) {
    const f = el.dataset.f;
    if (f === 'partial') { S.draft.partial = el.checked; saveSoon(); return; }
    if (f === 'notes') { S.draft.notes = el.value; saveSoon(); return; }
    if (e.type !== 'change') return;
    if (f === 'type') {
      S.draft.type = el.value;
      if (S.draft.exercises.every(x => !x.sets.length)) S.draft.exercises = (TEMPLATES[el.value] || []).map(n => ({name:n, sets:[]}));
      save(); render();
    } else if (f === 'date') { S.draft.date = el.value || todayStr(); save(); render(); }
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

render();
</script>
</body>
</html>
